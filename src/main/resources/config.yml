# %count% is replaced with the player's totem pop count.
# Supports & color codes.
suffix-format: " &e[&6%count%&e]"

# Hide the suffix when the count is 0
hide-when-zero: false

# Where the counter is shown. Set to true to turn one on.
# Everything here is per-player: each player sees counts relative to their own /resettotemcounter.
display:
  # Chat messages: <Name [3]> hello
  chat: false
  # Tab list. Needs the TAB plugin with %rel_totemcounter_tab% in tabsuffix.
  tab: false
  # Nametags above heads. Needs the TAB plugin with %rel_totemcounter_nametag% in tagsuffix.
  nametag: true

# Built-in nametag / tab list display (no TAB plugin needed).
# NOTE: these show the SAME number to everyone (not affected by anyone's reset).
show-on-nametag: false
show-on-tablist: false

messages:
  reset: "&aReset everyone's totem counter &lfor you&a."
  player-only: "&cOnly players can use this command."
  no-permission: "&cYou don't have permission."
  toggle-on: "&aYour totem counter is now &lvisible&a."
  toggle-off: "&eYour totem counter is now &lhidden&e (still counting)."
  global-on: "&aTotem counters are now &lenabled&a for everyone."
  global-off: "&eTotem counters are now &ldisabled&e for everyone."
