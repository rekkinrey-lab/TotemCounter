# %count% is replaced with the player's totem pop count.
# Supports & color codes.
suffix-format: " &e[&6%count%&e]"

# Hide the suffix when a player's count is 0
hide-when-zero: false

# Where the suffix is shown
show-on-nametag: true
show-on-tablist: true

messages:
  reset: "&aYour totem counter has been reset."
  player-only: "&cOnly players can use this command."
