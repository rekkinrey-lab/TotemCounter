name: TotemCounter
version: 1.1.0
main: me.totemcounter.TotemCounter
api-version: "1.20"
softdepend: [LuckPerms, PlaceholderAPI]
description: Shows how many totems each player has popped as a name suffix.

commands:
  resettotemcounter:
    description: Reset your own totem pop counter.
    usage: /resettotemcounter
    permission: totemcounter.reset
    aliases: [rtc]
  totemcounter:
    description: Toggle the totem counter display.
    usage: /totemcounter <toggle|global|reload>
    aliases: [tc]

permissions:
  totemcounter.reset:
    description: Reset your own totem counter.
    default: true
  totemcounter.toggle:
    description: Hide/show your own totem counter.
    default: true
  totemcounter.admin:
    description: Toggle the whole feature for everyone and reload the config.
    default: op
